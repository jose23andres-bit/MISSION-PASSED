name: Release readiness

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Generate fail-closed readiness report
        shell: bash
        run: npm run launch:readiness || test "$?" -eq 2
      - name: Package reviewed site
        run: zip -r MISSION_PASSED_FINAL.zip . -x '*.git*' '*.env' 'deployment/*.json' 'node_modules/*'
      - uses: actions/upload-artifact@v4
        with:
          name: mission-passed-${{ github.sha }}
          path: MISSION_PASSED_FINAL.zip
          if-no-files-found: error
          retention-days: 14
